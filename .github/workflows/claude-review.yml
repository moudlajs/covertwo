name: Claude review

on:
  pull_request:
    # `opened` is included so a PR opened straight as ready still gets a
    # review; drafts are filtered out by the job condition below.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# A new push cancels a review of the now-stale diff. Comment runs never
# cancel: workflow-level concurrency is evaluated before the job `if`, so a
# comment would otherwise kill a running review and then skip itself.
concurrency:
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Required status check. Skipped (= passing) for drafts, forks,
  # Dependabot and release-please PRs so they never burn subscription quota.
  claude-review:
    name: claude-review
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Minted with `claude setup-token`: uses the Claude subscription,
          # not a metered API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Without these the review runs but has no permission to post, and
          # nothing ever appears on the PR. The read-only git/gh commands are
          # needed too: when a command is denied the review can give up and
          # still end "successfully" with no comment at all.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the working directory.

            Post your findings as GitHub comments - do not return them as a
            message, or nobody will see them:
              - `gh pr comment` for one overall summary
              - `mcp__github_inline_comment__create_inline_comment` with
                `confirmed: true` for a specific line

            Always finish by posting exactly one summary comment with
            `gh pr comment`, even if you find nothing.

            Review this pull request against CLAUDE.md and CONTRIBUTING.md.
            Read the linked issue (`gh issue view <N>`) and check the change
            meets its acceptance criteria and nothing beyond them. For the
            diff use `gh pr diff` or `git diff origin/main...HEAD`; skip
            binary files such as screenshots.

            Prioritise, in order:
            1. Correctness: time zone / UTC handling, ESPN response mapping
               (missing or unexpected fields), polling lifecycle and cleanup,
               stale data after errors.
            2. Tests: new behaviour has unit tests; UI flows touched have e2e
               coverage; tests never hit the real ESPN API.
            3. KISS: flag abstractions, dependencies, or config added ahead of
               need. Smaller is better.
            4. Accessibility: semantics, labels, keyboard use, focus,
               contrast, reduced motion.

            Be specific: file:line, a concrete failing scenario, and a
            suggested fix. If you find nothing significant, say so in one
            line instead of padding. Do not approve or merge.

  # `@claude` in a PR or issue comment, from the repo owner only.
  claude-mention:
    name: claude-mention
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
