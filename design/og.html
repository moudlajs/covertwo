<style>
  html,
  body {
    margin: 0;
  }
  .card {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 0 96px;
    display: flex;
    align-items: center;
    gap: 72px;
    background:
      radial-gradient(ellipse at 12% 0%, rgb(251 191 36 / 0.16), transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgb(56 189 248 / 0.09), transparent 45%), #0b1020;
    font-family: 'JetBrains Mono', monospace;
    color: #f1f5f9;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 40px;
    height: 150px;
    transform: rotate(-8deg);
    background: repeating-linear-gradient(
      90deg,
      rgb(255 255 255 / 0.05) 0 3px,
      transparent 3px 44px
    );
  }
  .icon {
    width: 300px;
    height: 300px;
    flex: none;
    border-radius: 66px;

    box-shadow:
      0 30px 60px -20px rgb(0 0 0 / 0.8),
      0 0 0 1px rgb(148 163 184 / 0.2);
    position: relative;
  }
  .icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .text {
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: relative;
  }
  .url {
    font-size: 22px;
    color: #94a3b8;
  }
  .name {
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
  }
  .name b {
    color: #fbbf24;
    font-weight: 800;
  }
  .tag {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 32px;
    line-height: 1.3;
    color: #cbd5e1;
    max-width: 640px;
  }
  .chips {
    display: flex;
    gap: 12px;
  }
  .chips span {
    border: 1px solid rgb(251 191 36 / 0.45);

    border-radius: 6px;

  }

    <span class="tag">A calm NFL and college football scoreboard.</span>
    <div class="chips">

  </div>
