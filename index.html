<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="covertwo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small, calm NFL and college football live scoreboard." />
    <meta name="theme-color" content="#0b1020" />
    <script>
      // Theme before first paint, so light users never see a dark flash.
      // Mirrors src/lib/theme.ts (key "covertwo:theme"), which takes over after load.
      try {
        var choice = localStorage.getItem('covertwo:theme')
        var light =
          choice === 'light' ||
          (choice !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (light) document.querySelector('meta[name="theme-color"]').content = '#f3efe6'
      } catch (e) {}
    </script>
    <title>covertwo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

      Cloudflare Web Analytics: cookieless, no consent banner needed. The plain JS

      in the Cloudflare dashboard: Analytics & Logs > Web Analytics > your site >

</html>
